<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Al Shujaiat Foundation Jammu & Kashmir | Empowering Communities, Transforming Lives</title>
    <meta name="description" content="Official platform of Al Shujaiat Foundation Jammu & Kashmir. Supporting clean water, education, healthcare, orphan sponsorship, and emergency relief across Himalayan communities. DARPAN: JK/2018/0190361 | 80G Exempt." />
    <meta name="keywords" content="Al Shujaiat Foundation, ASFJK, NGO Jammu Kashmir, donate India, clean water Kashmir, education NGO, emergency relief, humanitarian, volunteer Kashmir" />
    <link rel="canonical" href="https://www.asfjk.org/" />

    <!-- Theme & PWA -->
    <meta name="theme-color" content="#7C3AED" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ASFJK" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.asfjk.org/" />
    <meta property="og:site_name" content="Al Shujaiat Foundation Jammu & Kashmir" />
    <meta property="og:title" content="Al Shujaiat Foundation JK | Empowering Communities" />
    <meta property="og:description" content="Supporting clean water, education, healthcare, and emergency relief across Jammu & Kashmir. 100% financially transparent. Donate securely — 80G & FCRA certified." />
    <meta property="og:image" content="https://www.asfjk.org/images/logo.png" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@asfjk" />
    <meta name="twitter:title" content="Al Shujaiat Foundation JK | Donate & Volunteer" />
    <meta name="twitter:description" content="Empowering remote Himalayan communities with clean water, STEM education, and emergency relief. Register as a volunteer or donate today." />
    <meta name="twitter:image" content="https://www.asfjk.org/images/logo.png" />

    <!-- Security -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "NGO",
      "name": "Al Shujaiat Foundation Jammu & Kashmir",
      "alternateName": "ASFJK",
      "url": "https://www.asfjk.org",
      "logo": "https://www.asfjk.org/images/logo.png",
      "description": "A registered charitable foundation delivering clean water, education, healthcare and emergency relief in Jammu & Kashmir.",
      "foundingDate": "2018",
      "areaServed": "Jammu & Kashmir, India",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-1933-351585",
        "contactType": "Customer Service",
        "email": "info@asfjk.org"
      },
      "sameAs": [
        "https://www.asfjk.org"
      ]
    }
    </script>

    <!-- Google Fonts: Preconnect & Load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-white text-content-primary antialiased selection:bg-brand-pink selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
